[package]
name = "remotesmith-tray"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "RemoteSmith presence tray / menu-bar app (sidecar to the RemoteSmith RustDesk fork)"
license = "AGPL-3.0-only"
publish = false
default-run = "remotesmith-tray"

[lib]
name = "remotesmith_tray"
path = "src/lib.rs"

[[bin]]
name = "remotesmith-tray"
path = "src/main.rs"

[[bin]]
name = "fake-fork"
path = "src/bin/fake-fork.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt", "net", "io-util", "time", "sync", "macros", "signal"] }
log = { version = "0.4", features = ["std"] }
regex = "1"
dirs = "7"
tray-icon = "0.26.1"
muda = "0.21.2"
tao = "0.37.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_Pipes",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
